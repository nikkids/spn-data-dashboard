# Tema SPN Data Explorer: biru royal khas website SPN, tombol pink, teks navy.
# Letakkan folder .streamlit ini di samping app.py.

[theme]
base = "light"
primaryColor = "#2F5FC0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5FD"
textColor = "#1A1464"
linkColor = "#2F5FC0"
borderColor = "#DCE4F5"
showWidgetBorder = true
baseRadius = "1rem"
buttonRadius = "full"
dataframeBorderColor = "#DCE4F5"
dataframeHeaderBackgroundColor = "#EAF0FC"

[theme.sidebar]
backgroundColor = "#F6F8FE"
secondaryBackgroundColor = "#EAF0FC"
